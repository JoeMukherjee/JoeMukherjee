<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Pritam Mukherjee - AI agent and harness engineer, sailing the Grand Line of AI">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1437"/><stop offset="0.55" stop-color="#3a2a6b"/>
      <stop offset="0.8" stop-color="#e2625b"/><stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="sea1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14508c"/><stop offset="1" stop-color="#0a2a55"/></linearGradient>
    <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d3b73"/><stop offset="1" stop-color="#061a3a"/></linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff4c2"/><stop offset="0.6" stop-color="#ffd25e"/><stop offset="1" stop-color="#ff9f43" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="340" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="90" cy="40" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="80" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="30" r="2"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="64" r="1.5"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="26" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="70" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="36" r="2"><animate attributeName="opacity" values="1;.4;1" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="1010" cy="205" r="95" fill="url(#sun)"><animate attributeName="r" values="92;100;92" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="1010" cy="205" r="42" fill="#ffe08a"/>
  <!-- drifting clouds -->
  <g fill="#ffffff" opacity=".16">
    <ellipse cx="200" cy="120" rx="70" ry="12"><animateTransform attributeName="transform" type="translate" values="-60 0;60 0;-60 0" dur="26s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="700" cy="95" rx="90" ry="14"><animateTransform attributeName="transform" type="translate" values="40 0;-50 0;40 0" dur="32s" repeatCount="indefinite"/></ellipse>
  </g>
  <!-- back waves -->
  <path fill="url(#sea1)" d="M-600 220 Q-500 200 -400 220 T-200 220 T0 220 T200 220 T400 220 T600 220 T800 220 T1000 220 T1200 220 T1400 220 T1600 220 T1800 220 T2000 220 V340 H-600Z">
    <animateTransform attributeName="transform" type="translate" values="0 0;-200 0;0 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <!-- ship (original silhouette) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.2s" repeatCount="indefinite"/>
    <g transform="translate(790 118)">
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="-2 60 90;2 60 90;-2 60 90" dur="3.2s" repeatCount="indefinite"/>
      <path d="M0 90 H125 Q115 118 85 122 H35 Q8 118 0 90Z" fill="#2b1a12"/>
      <rect x="58" y="12" width="4" height="78" fill="#2b1a12"/>
      <path d="M62 16 Q112 40 62 80Z" fill="#fdf3dc"/>
      <path d="M58 22 Q16 44 58 76Z" fill="#f5e3bd"/>
      <path d="M62 12 L88 18 L62 24Z" fill="#e0453d"><animateTransform attributeName="transform" type="skewY" values="0;-6;0" dur="1.6s" repeatCount="indefinite"/></path>
      <circle cx="12" cy="92" r="9" fill="#ffcf5a" stroke="#2b1a12" stroke-width="2"/>
    </g>
  </g>
  <!-- front waves -->
  <path fill="url(#sea2)" opacity=".95" d="M-600 250 Q-525 228 -450 250 T-300 250 T-150 250 T0 250 T150 250 T300 250 T450 250 T600 250 T750 250 T900 250 T1050 250 T1200 250 T1350 250 T1500 250 T1650 250 T1800 250 T1950 250 V340 H-600Z">
    <animateTransform attributeName="transform" type="translate" values="0 0;150 0;0 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path fill="#06142f" d="M-600 285 Q-525 268 -450 285 T-300 285 T-150 285 T0 285 T150 285 T300 285 T450 285 T600 285 T750 285 T900 285 T1050 285 T1200 285 T1350 285 T1500 285 T1650 285 T1800 285 T1950 285 V340 H-600Z">
    <animateTransform attributeName="transform" type="translate" values="0 0;-150 0;0 0" dur="7s" repeatCount="indefinite"/>
  </path>
  <!-- title -->
  <text x="60" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#fff4d6" stroke="#1a0f2e" stroke-width="1.2" paint-order="stroke">Pritam Mukherjee</text>
  <text x="62" y="192" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="22" fill="#ffd25e" letter-spacing="3">AI AGENT &#183; HARNESS &#183; BACKEND ENGINEER</text>
  <g font-family="'Trebuchet MS', Verdana, sans-serif" font-size="20" fill="#ffffff">
    <text x="62" y="232"><animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;.22;.25;.5;.5;.75;.75;.97;1" dur="12s" repeatCount="indefinite"/>Sailing the Grand Line of AI agents</text>
    <text x="62" y="232" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;.25;.28;.47;.5;.97;1" dur="12s" repeatCount="indefinite"/>Xeon AMX latency: 1,260 ms to 9.1 ms</text>
    <text x="62" y="232" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.5;.53;.72;.75;1" dur="12s" repeatCount="indefinite"/>Self-improving harnesses, evals and loops</text>
    <text x="62" y="232" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.75;.78;.97;1" dur="12s" repeatCount="indefinite"/>Bengaluru, India &#183; open to new crews</text>
  </g>
</svg>
