<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Wanted poster style card for Pritam Mukherjee">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dfb0"/><stop offset="1" stop-color="#d9b97c"/></linearGradient>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .08  0 0 0 .25 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <rect width="1200" height="420" fill="#0a1d3f"/>
  <g transform="translate(300 10) rotate(-0.8 300 200)">
    <rect width="600" height="400" rx="10" fill="url(#paper)" stroke="#6b4a1f" stroke-width="6"/>
    <rect width="600" height="400" rx="10" fill="#fff" filter="url(#rough)" opacity=".5"/>
    <text x="300" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#3a2410" letter-spacing="8">WANTED</text>
    <text x="300" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#3a2410" letter-spacing="4">FOR SHIPPING AGENTS THAT ACTUALLY WORK</text>
    <rect x="40" y="104" width="190" height="190" fill="#f8ecc8" stroke="#3a2410" stroke-width="4"/>
    <!-- original straw-hat portrait icon -->
    <g transform="translate(135 200)">
      <ellipse cx="0" cy="22" rx="70" ry="15" fill="#e9b949" stroke="#3a2410" stroke-width="3"/>
      <path d="M-40 22 Q-40 -34 0 -34 Q40 -34 40 22Z" fill="#f2c85b" stroke="#3a2410" stroke-width="3"/>
      <rect x="-40" y="2" width="80" height="12" fill="#d6382f" stroke="#3a2410" stroke-width="2"/>
      <circle cx="-14" cy="52" r="3.5" fill="#3a2410"/><circle cx="14" cy="52" r="3.5" fill="#3a2410"/>
      <path d="M-16 66 Q0 78 16 66" fill="none" stroke="#3a2410" stroke-width="3" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" values="-2 135 200;2 135 200;-2 135 200" dur="4s" repeatCount="indefinite" additive="sum"/>
    </g>
    <text x="135" y="324" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#3a2410">PRITAM MUKHERJEE</text>
    <text x="135" y="346" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#3a2410" letter-spacing="2">"JOE"</text>
    <g font-family="'Trebuchet MS', Verdana, sans-serif" fill="#3a2410">
      <text x="260" y="130" font-size="16" font-weight="700" letter-spacing="2">KNOWN FOR</text>
      <text x="260" y="162" font-size="17">&#9875; Meta-Evolver agent harness</text>
      <text x="260" y="192" font-size="17">&#9889; 138x faster Xeon AMX inference</text>
      <text x="260" y="222" font-size="17">&#9733; 2 arXiv papers on causal AI</text>
      <text x="260" y="252" font-size="17">&#9881; Agent loops, evals, memory</text>
      <text x="260" y="296" font-size="16" font-weight="700" letter-spacing="2">LAST SEEN</text>
      <text x="260" y="322" font-size="17">Bengaluru, India</text>
      <text x="260" y="360" font-size="16" font-weight="700" letter-spacing="2">BOUNTY</text>
      <text x="260" y="388" font-size="22" font-weight="700" fill="#b3261e">&#8734; tokens, 0 lost updates</text>
    </g>
  </g>
</svg>
